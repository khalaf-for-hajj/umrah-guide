<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#a87b1e">
<title>شاشة الشيخ — الدليل التفاعلي للمعتمر</title>
<link rel="preload" href="assets/fonts/noto-naskh-arabic-arabic-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/img/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<style>
  .sh-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: var(--card); border-bottom: 3px solid var(--gold); position: sticky; top: 0; z-index: 20; }
  .sh-top .codechip { font-weight: 800; font-size: 1.15em; background: var(--gold-soft); color: var(--gold); border: 2px solid var(--gold); border-radius: 12px; padding: 4px 14px; cursor: pointer; direction: ltr; }
  .sh-top .stat { font-size: .78em; font-weight: 800; padding: 4px 10px; border-radius: 10px; background: var(--teal-soft); color: var(--teal); }
  .sh-top .stat.bad { background: var(--warn-soft); color: var(--warn); }
  .sh-top .stat.priv { background: var(--blue-soft); color: var(--blue); }
  .sh-top .btn { min-height: 44px; padding: .3em .8em; font-size: .85em; }
  .sh-wrap { display: grid; gap: 14px; max-width: 1400px; margin: 0 auto; padding: 12px; width: 100%; flex: 1; }
  @media (min-width: 1000px) { .sh-wrap { grid-template-columns: 1fr 340px; align-items: start; } .sh-side { position: sticky; top: 76px; } }
  .sh-pos { text-align: center; font-weight: 800; color: var(--blue); font-size: 1.1em; }
  .sh-pos.huge { font-size: 2.6em; line-height: 1.3; background: var(--warn-soft); border: 3px solid var(--warn); border-radius: 18px; padding: 10px; color: var(--warn); }
  .sh-controls { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; position: sticky; bottom: 0; background: var(--bg); padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); z-index: 10; }
  .sh-controls .btn { min-height: 76px; font-size: 1.3em; }
  .bigcode { font-size: min(28vw, 220px); font-weight: 800; letter-spacing: .08em; direction: ltr; color: var(--blue); line-height: 1; margin: 10px 0; }
  .timer { font-size: 1.6em; font-weight: 800; direction: ltr; text-align: center; color: var(--blue); }
  .timer.over { color: var(--red); }
  .notes { white-space: pre-wrap; font-size: .9em; }
  .jump select { width: 100%; font-size: 1em; min-height: 52px; border: 2px solid var(--gold); border-radius: 12px; background: var(--card); padding: 6px; }
  .slide-hidden-note { text-align: center; padding: 6px; border-radius: 10px; background: var(--ink); color: var(--bg); font-weight: 800; position: absolute; top: 6px; inset-inline: 30%; z-index: 5; }
  .sh-stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: calc(100dvh - 230px); }
  .sh-pos .small { color: var(--ink-2); }
  .trow { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--line); font-size: .9em; }
  .trow.over b { color: var(--red); }
  .notes { font-size: .9em; }
  .phone-only { display: none !important; }
  /* الجوال: شريط علوي في سطر واحد، والمنصة تملأ الشاشة (يُحسب ارتفاعها في الكود) */
  body.sh-phone .wide-only { display: none !important; }
  body.sh-phone .phone-only { display: inline-flex !important; }
  body.sh-phone .sh-top { flex-wrap: nowrap; gap: 6px; padding: 6px 8px; }
  body.sh-phone .sh-top .mark { width: 34px !important; height: 34px !important; }
  body.sh-phone .sh-top .codechip { font-size: 1em; padding: 2px 10px; white-space: nowrap; flex: none; }
  body.sh-phone .sh-top .stat { font-size: .7em; padding: 3px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  body.sh-phone .sh-top .btn { min-height: 42px; padding: .2em .6em; font-size: .85em; white-space: nowrap; }
  body.sh-phone .sh-wrap { padding: 6px 6px 12px; gap: 10px; }
  body.sh-phone .sh-stage { aspect-ratio: auto; max-height: none; }
  body.sh-phone .sh-pos { font-size: .85em; line-height: 1.4; }
  body.sh-phone .sh-pos .small { display: none; }
  body.sh-phone .sh-pos.huge { font-size: 1.5em; padding: 4px; }
  body.sh-phone .sh-controls { padding: 6px 0 calc(6px + env(safe-area-inset-bottom)); gap: 8px; }
  body.sh-phone .sh-controls .btn { min-height: 58px; font-size: 1.1em; white-space: nowrap; padding-inline: .4em; }
  @media (max-height: 520px) { body.sh-phone .sh-controls .btn { min-height: 46px; } }
</style>
</head>
<body>
<div id="app"><div class="spinner" role="status" aria-label="جارٍ التحميل"></div></div>
<script type="module" src="js/sheikh.js"></script>
</body>
</html>
