<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>كتاب الشيخ — الدليل التفاعلي للمعتمر</title>
<link rel="icon" href="assets/img/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<style>
  /* كتاب الشيخ: العرض وشرح الشيخ وملاحظاته في كتاب واحد للطباعة أو الحفظ PDF */
  @page { size: A4; margin: 16mm 15mm 18mm; }
  @page { @bottom-center { content: counter(page); font-family: Tajawal, sans-serif; font-size: 10pt; color: #8a7a55; } }
  @page :first { @bottom-center { content: none; } }
  body { background: #e9e4d8; display: block; }
  :root, :root[data-theme="dark"] { color-scheme: light; --bg: #fbf8f1; --card: #fff; --ink: #1d2427; --ink-2: #4c575c; --line: #e4dccb; --gold: #a87b1e; --gold-2: #d4a955; --gold-soft: #f6ecd6; --teal: #3f8f86; --teal-soft: #e3f1ef; --blue: #23558f; --blue-soft: #e4edf8; --red: #b3261e; --warn: #9a5b00; --warn-soft: #fff3dc; --ok: #2e7d4f; }
  .bk-tools { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 3px solid var(--gold); padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; font-size: 16px; }
  .bk-tools select { min-height: 44px; border: 2px solid var(--gold); border-radius: 10px; padding: 4px 8px; font-size: 16px; background: var(--card); }
  .bk-tools label { display: inline-flex; gap: 6px; align-items: center; font-weight: 700; }
  .bk-tools .btn { min-height: 46px; }
  .bk-tools .hint { flex-basis: 100%; font-size: 13px; color: var(--ink-2); }
  .book { width: 210mm; max-width: 100%; margin: 16px auto; background: #fff; padding: 16mm 15mm; box-shadow: 0 4px 24px rgb(0 0 0 / 15%); font-family: Naskh, Tajawal, serif; font-size: 13pt; line-height: 1.75; color: #1d2427; }
  .book h1, .book h2, .book h3 { font-family: Tajawal, sans-serif; }

  .cover { position: static; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 250mm; gap: 6mm; break-after: page; background: none; padding: 0; }
  .cover img { width: 70mm; height: auto; }
  .cover .k1 { font-family: Tajawal, sans-serif; font-size: 30pt; font-weight: 800; color: var(--gold); line-height: 1.3; }
  .cover .k2 { font-size: 20pt; font-weight: 700; color: var(--blue); }
  .cover .k3 { font-family: Tajawal, sans-serif; font-size: 12pt; color: var(--ink-2); }
  .cover .box { border: 2px solid var(--gold-2); border-radius: 12px; padding: 4mm 8mm; font-family: Tajawal, sans-serif; font-size: 11pt; color: var(--warn); background: var(--warn-soft); }

  .intro { break-after: page; }
  .intro h2 { font-size: 17pt; color: var(--gold); margin: 0 0 3mm; border-bottom: 2px solid var(--gold-2); padding-bottom: 1mm; }
  .legend { display: grid; gap: 2mm; margin: 0 0 7mm; font-size: 11.5pt; }
  .legend div { display: flex; gap: 3mm; align-items: center; }
  .toc { width: 100%; border-collapse: collapse; font-family: Tajawal, sans-serif; font-size: 11pt; margin-bottom: 6mm; }
  .toc th, .toc td { border-bottom: 1px solid var(--line); padding: 1.6mm 2mm; text-align: start; }
  .toc th { background: var(--gold-soft); color: var(--gold); }
  .toc .ch td { background: var(--blue-soft); color: var(--blue); font-weight: 800; }
  .toc td.n { white-space: nowrap; direction: ltr; text-align: end; }

  .chap-h { font-size: 22pt; color: #fff; background: linear-gradient(90deg, var(--gold), var(--gold-2)); padding: 3mm 6mm; border-radius: 10px; margin: 0 0 5mm; break-before: page; break-after: avoid; }
  .chap-h:first-of-type { break-before: auto; }
  .sec-h { font-size: 15pt; color: var(--blue); border-bottom: 2.5px solid var(--blue); padding-bottom: 1mm; margin: 7mm 0 3mm; break-after: avoid; display: flex; justify-content: space-between; gap: 4mm; }
  .sec-h span { font-size: 11pt; color: var(--ink-2); font-weight: 500; white-space: nowrap; }

  .bs { border: 1.5px solid var(--gold-2); border-radius: 10px; margin: 0 0 5mm; overflow: hidden; }
  .bs-head { display: flex; gap: 3mm; align-items: baseline; background: var(--gold-soft); padding: 1.5mm 4mm; break-after: avoid; font-family: Tajawal, sans-serif; }
  .bs-head .no { font-weight: 800; color: var(--gold); white-space: nowrap; }
  .bs-head .tt { font-weight: 800; color: var(--ink); flex: 1; }
  .bs-head .aud { font-size: 10pt; color: var(--red); font-weight: 800; }
  .bs-body { padding: 2.5mm 4mm 3mm; }
  .bs-step { font-family: Tajawal, sans-serif; font-size: 9.5pt; font-weight: 800; color: var(--teal); margin: 2mm 0 1mm; display: flex; align-items: center; gap: 2mm; break-after: avoid; }
  .bs-step::after { content: ''; flex: 1; border-top: 1px dashed var(--teal); }
  .book .blk { margin: 0 0 2mm; border-radius: 8px; break-inside: avoid; }
  .book .t-box, .book .ruling, .book .qa, .book .nass { border-width: 1.5px; padding: 2mm 3mm; }
  .book .t-heading { padding: 1.5mm 3mm; }
  .book .t-label { display: inline-block; padding: 0 3mm; }
  .book .badge { box-shadow: none; }
  .book .img img { max-height: 55mm; width: auto; border-width: 1.5px; }
  .book .nass .tags, .book .qa .reveal, .book .video .row, .book .video .small, .book .wm { display: none; }
  .book .v-link { font-family: Tajawal, sans-serif; font-size: 10pt; direction: ltr; text-align: start; word-break: break-all; color: var(--blue); }
  .book .chip { font-size: 9pt; }
  .book .src { font-size: 10pt; }
  .book .ruling .r-op { margin-top: 1.5mm; padding: 1mm 3mm; }

  .bx { border-radius: 8px; padding: 2.5mm 4mm; margin-top: 3mm; break-inside: avoid; font-size: 12.5pt; }
  .bx > b { display: block; font-family: Tajawal, sans-serif; font-size: 10.5pt; margin-bottom: 1mm; }
  .bx.ex { background: var(--teal-soft); border-inline-start: 5px solid var(--teal); }
  .bx.ex > b { color: var(--teal); }
  .bx.nt { background: #fbf6ea; border-inline-start: 5px solid var(--gold); }
  .bx.nt > b { color: var(--gold); }
  .bx p { margin: 0 0 1.2mm; }
  .bx .ts { font-family: Tajawal, sans-serif; font-size: 9.5pt; color: var(--ink-2); direction: ltr; unicode-bidi: isolate; }

  @media print {
    body { background: #fff; }
    .bk-tools { display: none !important; }
    .book { width: auto; margin: 0; padding: 0; box-shadow: none; }
    .cover { min-height: 255mm; }
  }
  @media screen and (max-width: 820px) { .book { padding: 8mm 6mm; font-size: 12pt; } }
</style>
</head>
<body>
<div id="app"><div class="spinner" role="status" aria-label="جارٍ التحميل"></div></div>
<script type="module" src="js/book.js"></script>
</body>
</html>
